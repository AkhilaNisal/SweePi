---
- name: Install Restic
  ansible.builtin.apt:
    name: restic
    state: present
    lock_timeout: 120

- name: Install Restic password
  ansible.builtin.copy:
    dest: "{{ sweepi_config_root }}/restic-password"
    owner: root
    group: root
    mode: "0600"
    content: "{{ sweepi_restic_password }}\n"
  no_log: true

- name: Install Restic environment
  ansible.builtin.template:
    src: restic.env.j2
    dest: "{{ sweepi_config_root }}/restic.env"
    owner: root
    group: root
    mode: "0600"

- name: Install backup program
  ansible.builtin.template:
    src: sweepi_backup.sh.j2
    dest: "{{ sweepi_install_root }}/backup/sweepi_backup.sh"
    owner: root
    group: root
    mode: "0750"

- name: Install backup service
  ansible.builtin.template:
    src: sweepi-backup.service.j2
    dest: /etc/systemd/system/sweepi-backup.service
    owner: root
    group: root
    mode: "0644"

- name: Install backup timer
  ansible.builtin.template:
    src: sweepi-backup.timer.j2
    dest: /etc/systemd/system/sweepi-backup.timer
    owner: root
    group: root
    mode: "0644"

- name: Enable backup timer
  ansible.builtin.systemd_service:
    name: sweepi-backup.timer
    enabled: true
    state: started
    daemon_reload: true
