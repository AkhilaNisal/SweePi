---
- name: Update APT cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600
    lock_timeout: 120

- name: Perform complete Ubuntu package upgrade
  ansible.builtin.apt:
    upgrade: full
    update_cache: true
    autoremove: "{{ sweepi_apt_autoremove | bool }}"
    lock_timeout: 600
  when: sweepi_perform_full_upgrade | bool
  register: sweepi_full_upgrade
  notify: Check reboot requirement

- name: Install base host packages
  ansible.builtin.apt:
    name: "{{ sweepi_base_packages }}"
    state: present
    lock_timeout: 180

- name: Set hostname
  ansible.builtin.hostname:
    name: "{{ sweepi_hostname }}"

- name: Disable cloud-init /etc/hosts management
  ansible.builtin.copy:
    dest: /etc/cloud/cloud.cfg.d/99-sweepi-hosts.cfg
    owner: root
    group: root
    mode: "0644"
    content: |
      # Managed by SweePi Ansible. Keep /etc/hosts stable for mDNS/SSH.
      manage_etc_hosts: false
  when: sweepi_disable_cloud_init_hosts_management | bool

- name: Ensure IPv4 localhost entry exists
  ansible.builtin.lineinfile:
    path: /etc/hosts
    regexp: '^127\.0\.0\.1\s+'
    line: 127.0.0.1 localhost
    create: true
    owner: root
    group: root
    mode: "0644"
  when: sweepi_manage_etc_hosts | bool

- name: Ensure hostname entry exists
  ansible.builtin.lineinfile:
    path: /etc/hosts
    regexp: '^127\.0\.1\.1\s+'
    line: "127.0.1.1 {{ sweepi_hostname }}"
    create: true
    owner: root
    group: root
    mode: "0644"
  when: sweepi_manage_etc_hosts | bool

- name: Preserve IPv6 localhost entries
  ansible.builtin.blockinfile:
    path: /etc/hosts
    marker: "# {mark} SWEEPI IPV6 LOCALHOST"
    block: |
      ::1     ip6-localhost ip6-loopback
      fe00::0 ip6-localnet
      ff00::0 ip6-mcastprefix
      ff02::1 ip6-allnodes
      ff02::2 ip6-allrouters
    create: true
    owner: root
    group: root
    mode: "0644"
  when: sweepi_manage_etc_hosts | bool

- name: Set timezone
  community.general.timezone:
    name: "{{ sweepi_timezone }}"

- name: Ensure UTF-8 locale exists
  community.general.locale_gen:
    name: "{{ sweepi_locale }}"
    state: present

- name: Configure system locale defaults
  ansible.builtin.copy:
    dest: /etc/default/locale
    owner: root
    group: root
    mode: "0644"
    content: |
      LANG={{ sweepi_locale }}
      LC_ALL={{ sweepi_locale }}

- name: Enable SSH
  ansible.builtin.systemd_service:
    name: ssh.service
    enabled: true
    state: started

- name: Enable mDNS
  ansible.builtin.systemd_service:
    name: avahi-daemon.service
    enabled: true
    state: started
  when: sweepi_enable_mdns | bool

- name: Load available groups
  ansible.builtin.getent:
    database: group

- name: Add robot user to available hardware groups
  ansible.builtin.user:
    name: "{{ sweepi_user }}"
    groups: "{{ item }}"
    append: true
  loop: "{{ sweepi_hardware_groups }}"
  when: item in ansible_facts.getent_group

- name: Create SweePi directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner }}"
    group: "{{ item.group }}"
    mode: "{{ item.mode }}"
  loop:
    - { path: "{{ sweepi_install_root }}", owner: root, group: root, mode: "0755" }
    - { path: "{{ sweepi_install_root }}/ble", owner: root, group: root, mode: "0755" }
    - { path: "{{ sweepi_install_root }}/power", owner: root, group: root, mode: "0755" }
    - { path: "{{ sweepi_install_root }}/backup", owner: root, group: root, mode: "0755" }
    - { path: "{{ sweepi_config_root }}", owner: root, group: root, mode: "0755" }
    - { path: "{{ sweepi_data_root }}", owner: "{{ sweepi_user }}", group: "{{ sweepi_user }}", mode: "0755" }
    - { path: "{{ sweepi_data_root }}/maps", owner: "{{ sweepi_user }}", group: "{{ sweepi_user }}", mode: "0755" }
    - { path: "{{ sweepi_data_root }}/calibration", owner: "{{ sweepi_user }}", group: "{{ sweepi_user }}", mode: "0755" }
    - { path: "{{ sweepi_log_root }}", owner: "{{ sweepi_user }}", group: "{{ sweepi_user }}", mode: "0755" }

- name: Mark host as Ansible managed
  ansible.builtin.copy:
    dest: "{{ sweepi_config_root }}/ansible-managed"
    owner: root
    group: root
    mode: "0644"
    content: |
      This SweePi Raspberry Pi is managed by deploy/ansible.
      Put permanent host changes in Git and rerun site.yml.
