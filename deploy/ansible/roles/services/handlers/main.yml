---
- name: Reload systemd
  ansible.builtin.systemd_service:
    daemon_reload: true

- name: Restart enabled SweePi services
  ansible.builtin.shell: |
    set -euo pipefail
    for unit in sweepi-api-bridge.service sweepi-robot.service; do
      if systemctl is-enabled --quiet "$unit"; then
        systemctl restart "$unit"
      fi
    done
  args:
    executable: /bin/bash
  changed_when: true
