---
- name: Install GPIO packages
  ansible.builtin.apt:
    name:
      - gpiod
      - python3-gpiozero
      - python3-lgpio
    state: present
    lock_timeout: 120

- name: Install power control environment
  ansible.builtin.template:
    src: sweepi-power.env.j2
    dest: "{{ sweepi_config_root }}/power.env"
    owner: root
    group: root
    mode: "0600"
  notify: Restart SweePi power control

- name: Install button and switch_bulb controller
  ansible.builtin.template:
    src: sweepi_power_control.py.j2
    dest: "{{ sweepi_install_root }}/power/sweepi_power_control.py"
    owner: root
    group: root
    mode: "0755"
  notify: Restart SweePi power control

- name: Install power control service
  ansible.builtin.template:
    src: sweepi-power-control.service.j2
    dest: /etc/systemd/system/sweepi-power-control.service
    owner: root
    group: root
    mode: "0644"
  notify:
    - Reload systemd
    - Restart SweePi power control

- name: Enable power control service
  ansible.builtin.systemd_service:
    name: sweepi-power-control.service
    enabled: true
    state: started
    daemon_reload: true
