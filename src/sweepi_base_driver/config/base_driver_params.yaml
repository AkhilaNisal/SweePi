base_driver_node:
  ros__parameters:
    serial_port: /dev/serial0
    baud_rate: 115200
    serial_timeout: 0.02
    reconnect_period: 1.0

    wheel_radius: 0.033
    wheel_separation: 0.200
    ticks_per_revolution: 7392.0
    left_encoder_sign: -1.0
    right_encoder_sign: 1.0

    command_rate_hz: 50.0
    feedback_poll_rate_hz: 100.0
    cmd_vel_timeout: 0.5
    motor_enable: true
    suction_enable: false
    brush_enable: false
    command_mode: NORMAL
    use_checksum: false

    cmd_vel_topic: /cmd_vel
    wheel_odom_topic: /wheel/odom
    imu_topic: /imu/data
    status_topic: /hardware/status
    odom_frame_id: odom
    base_frame_id: base_footprint
    imu_frame_id: imu_link

    gyro_units: rad_s
    accel_units: m_s2
    imu_angular_velocity_signs: [1.0, 1.0, 1.0]
    imu_linear_acceleration_signs: [1.0, 1.0, 1.0]

    wheel_odom_pose_covariance_diagonal: [0.02, 0.02, 99999.0, 99999.0, 99999.0, 0.05]
    wheel_odom_twist_covariance_diagonal: [0.02, 99999.0, 99999.0, 99999.0, 99999.0, 0.05]
    imu_angular_velocity_covariance_diagonal: [0.05, 0.05, 0.02]
    imu_linear_acceleration_covariance_diagonal: [0.2, 0.2, 0.2]
