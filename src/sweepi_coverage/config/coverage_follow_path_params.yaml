coverage_tracker_node:
  ros__parameters:
    use_sim_time: true
    global_frame: map
    robot_base_frame: base_link
    robot_radius_m: 0.18
    occupied_threshold: 50
    coverage_update_rate_hz: 2.0
    coverage_topic: /coverage_map

coverage_planner_node:
  ros__parameters:
    use_sim_time: true
    coverage_map_topic: "/coverage_map"
    nav_costmap_topic: "/global_costmap/costmap"
    coverage_path_topic: "/coverage_path"
    planning_mask_topic: "/coverage_planning_mask"
    coverage_percentage_topic: "/coverage_percentage"
    coverage_stats_topic: "/coverage_stats"
    coverage_cell_value: 50
    coverage_spacing_m: 0.25
    min_segment_length_m: 0.30
    inflation_radius_m: 0.28
    min_region_area_m2: 0.20
    path_publish_rate_hz: 1.0
    planning_direction: "auto"
    publish_debug_mask: true
    publish_debug_markers: false
    replan_on_map_change: true
    republish_last_path: true
    freeze_path_after_first_valid_plan: true
    connect_disjoint_segments: true
    connector_step_m: 0.10
    max_consecutive_pose_jump_m: 0.50
    connector_check_obstacles: true
    connector_allow_simple_straight_line: true
    optimize_segment_order: true
    allow_segment_reversal: true
    start_near_robot_if_tf_available: true
    debug_path_continuity: true
    use_nav_costmap_for_planning: true
    use_global_costmap_for_planning: true
    max_allowed_nav_cost: 90
    treat_unknown_cost_as_blocked: true
    nav_costmap_timeout_sec: 2.0
    wait_for_nav_costmap_before_planning: true
    wait_for_robot_pose_before_planning: true

coverage_follow_path_executor_node:
  ros__parameters:
    use_sim_time: true
    coverage_path_topic: "/coverage_path"
    active_path_topic: "/coverage_active_path"
    execution_status_topic: "/coverage_execution_status"
    nav2_feedback_topic: "/coverage_nav2_feedback"
    path_markers_topic: "/coverage_path_markers"
    follow_path_action_name: "/follow_path"
    controller_id: "FollowPath"
    goal_checker_id: ""
    progress_checker_id: ""
    auto_start: false
    execute_once_on_first_path: false
    min_path_poses: 2
    wait_for_nav2_timeout_sec: 10.0
    action_result_timeout_sec: 0.0
    republish_active_path_hz: 1.0
    allow_new_path_while_executing: false
    robot_base_frame: "base_link"
    tf_lookup_timeout_sec: 1.0
    require_robot_near_start: true
    max_start_distance_m: 0.50
    max_nearest_path_distance_m: 0.50
    minimum_path_length_m: 0.10
    max_consecutive_pose_jump_m: 0.50
    debug_info_topic: "/coverage_debug_info"
    debug_markers_topic: "/coverage_debug_markers"
    auto_restart_on_failed_progress: false
    failed_progress_restart_delay_sec: 1.0
    max_failed_progress_restarts: 3

coverage_manager_node:
  ros__parameters:
    use_sim_time: true
