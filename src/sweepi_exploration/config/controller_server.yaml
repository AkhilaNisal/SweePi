# =============================================================================
# controller_server.yaml – Local path follower configuration for SweePi
# =============================================================================
# Provides standalone configuration for the Nav2 controller server.
# Adjust velocities and accelerations to match SweePi's hardware limits.
# =============================================================================

controller_server:
  ros__parameters:
    use_sim_time: true
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    # How long to wait for progress before declaring failure
    failure_tolerance: 0.3

    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]

    # -------------------------------------------------------------------------
    # Progress checker – ensures the robot is actually moving toward the goal
    # -------------------------------------------------------------------------
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      # Minimum movement required within the time allowance
      required_movement_radius: 0.5
      movement_time_allowance: 10.0

    # -------------------------------------------------------------------------
    # Goal checker – determines when a goal is considered reached
    # -------------------------------------------------------------------------
    general_goal_checker:
      stateful: true
      plugin: "nav2_controller::SimpleGoalChecker"
      # Increase these tolerances if Nav2 keeps oscillating near the goal
      xy_goal_tolerance: 0.25
      yaw_goal_tolerance: 0.25

    # -------------------------------------------------------------------------
    # DWB local planner – the default Nav2 local controller
    # Implements Dynamic Window Approach with configurable critics
    # -------------------------------------------------------------------------
    FollowPath:
      plugin: "dwb_core::DWBLocalPlanner"
      # Enable to see sampled trajectories in RViz (useful for debugging)
      debug_trajectory_details: true

      # Velocity limits (m/s) – tune to match your SweePi hardware
      min_vel_x: 0.0
      min_vel_y: 0.0
      max_vel_x: 0.26
      max_vel_y: 0.0      # 0.0 for differential drive
      max_vel_theta: 1.0
      min_speed_xy: 0.0
      max_speed_xy: 0.26
      min_speed_theta: 0.0

      # Acceleration limits (m/s²)
      acc_lim_x: 2.5
      acc_lim_y: 0.0
      acc_lim_theta: 3.2
      decel_lim_x: -2.5
      decel_lim_y: 0.0
      decel_lim_theta: -3.2

      # Trajectory sampling
      vx_samples: 20
      vy_samples: 5
      vtheta_samples: 20
      sim_time: 1.7
      linear_granularity: 0.05
      angular_granularity: 0.025

      # Tolerance
      transform_tolerance: 0.2
      xy_goal_tolerance: 0.25
      trans_stopped_velocity: 0.25
      short_circuit_trajectory_evaluation: true
      stateful: true

      # Critics – each scores candidate trajectories
      critics:
        [
          "RotateToGoal",
          "Oscillation",
          "BaseObstacle",
          "GoalAlign",
          "PathAlign",
          "PathDist",
          "GoalDist",
        ]
      BaseObstacle.scale: 0.02
      PathAlign.scale: 32.0
      PathAlign.forward_point_distance: 0.1
      GoalAlign.scale: 24.0
      GoalAlign.forward_point_distance: 0.1
      PathDist.scale: 32.0
      GoalDist.scale: 24.0
      RotateToGoal.scale: 32.0
      RotateToGoal.slowing_factor: 5.0
      RotateToGoal.lookahead_time: -1.0