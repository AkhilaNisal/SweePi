slam_toolbox:
  ros__parameters:
    use_sim_time: true
    slam_mode: "mapping"
    solver_plugin: "solver_plugins::CeresSolver"
    ceres_linear_solver_type: "SPARSE_NORMAL_CHOLESKY"
    ceres_preconditioner_type: "SCHUR_JACOBI"
    ceres_use_nonmonotonic_steps: false
    ceres_linear_solver_threads: 1
    ceres_threads: 4
    base_frame: "base_link"
    odom_frame: "odom"
    map_frame: "map"
    scan_topic: "/scan"
    map_update_interval: 3.0
    resolution: 0.05
    max_laser_range: 12.0
    minimum_time_interval: 0.5
    transform_publish_period: 0.02
    max_submaps: 10000
    transform_timeout: 0.2
    tf_buffer_duration: 30.0
    minimum_travel_distance: 0.5
    minimum_travel_heading: 0.5
    use_scan_matching: true
    do_local_mapping: true
    scan_matcher_search_radius: 2.0
    scan_matcher_search_angle: 0.785
    do_loop_closing: true
    loop_search_maximum_distance: 3.0
    correlation_response_threshold: 0.7
    loop_response_threshold: 0.9
    max_correlation_distance: 0.3
    ngh_search_radius: 0.2
    loop_closure_threshold: 8.0
    loop_closure_search_radius: 8.0
    yaw_delta_threshold: 0.02
    laser_min_range: 0.1
    laser_max_range: 12.0
    laser_max_beams: 720
    laser_skip: 0
    min_particles: 600
    max_particles: 2000
    resample_interval: 1
    linear_update: 0.2
    angular_update: 0.1
    minimum_particle_weight: 0.1
    publish_pose: true
    publish_map_to_odom: true
    publish_tracked_poses: true
    publish_scan_matcher_pose: false
    serialization_server: true
    serialization_timeout: 10000
    serialization_interval: 2.0
    debug_logging: false
    use_robot_pose_initialization: false
    first_map_only: false
    approximate_sync: false
    max_trajectory_length: 10000
    occ_likelihood: true
    use_odom: true
    odom_only_mode: false
    optimize_between_updates: true
    optimization_period: 10.0