ekf_filter_node:
  ros__parameters:
    frequency: 40.0
    sensor_timeout: 0.10
    two_d_mode: true
    transform_time_offset: 0.0
    transform_timeout: 0.0
    print_diagnostics: false
    debug: false

    publish_tf: true
    map_frame: map
    odom_frame: odom
    base_link_frame: base_footprint
    world_frame: odom

    odom0: /wheel/odom
    odom0_queue_size: 5
    odom0_nodelay: true
    odom0_differential: false
    odom0_relative: false
    odom0_config: [
      false, false, false,
      false, false, false,
      true,  false, false,
      false, false, true,
      false, false, false
    ]

    # TEMPORARY:
    # IMU fusion is disabled for now.
    # Wheel odom has been verified correct, but IMU gyro scale/covariance/frame still needs calibration.
    # Keep /imu/data publishing for debugging, but do not fuse it into EKF until fixed.
    #
    # Previous IMU gyro-Z fusion config:
    # imu0: /imu/data
    # imu0_queue_size: 5
    # imu0_nodelay: true
    # imu0_differential: false
    # imu0_relative: false
    # imu0_remove_gravitational_acceleration: false
    # imu0_config: [
    #   false, false, false,
    #   false, false, false,
    #   false, false, false,
    #   false, false, true,
    #   false, false, false
    # ]

    imu0: /imu/data
    imu0_queue_size: 5
    imu0_nodelay: true
    imu0_differential: false
    imu0_relative: false
    imu0_remove_gravitational_acceleration: false
    imu0_config: [
      false, false, false,
      false, false, false,
      false, false, false,
      false, false, false,
      false, false, false
    ]
